[project]
name = "gridnav"
version = "0.1.0"
description = "A* planning, EKF localisation, pure pursuit and a replanning mission state machine on an occupancy grid"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gridnav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
